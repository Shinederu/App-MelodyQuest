<section class="mq-page mq-autoplay-page">
  <section class="mq-card mq-card--soft mq-autoplay-stage">
    <div class="mq-autoplay-head">
      <button id="btn-game-menu" type="button" class="mq-secondary mq-icon-button" aria-label="Menu de la partie" title="Menu de la partie" aria-controls="game-menu" aria-expanded="false">☰</button>
      <strong class="mq-round-counter">Manche <span id="autoplay-progress">-- / --</span></strong>
      <p id="autoplay-status" class="status">Préparation...</p>
      <section class="mq-drawer-section" data-game-menu-options aria-labelledby="game-menu-invite-title">
        <h2 id="game-menu-invite-title">Invitations et TV</h2>
        <button id="btn-autoplay-share" type="button" class="mq-secondary">Partager le salon</button>
        <button id="btn-autoplay-link-tv" type="button" class="mq-secondary">Lier une TV</button>
      </section>
      <button id="btn-autoplay-leave" type="button" class="mq-danger" data-game-menu-exit>Arrêter</button>
    </div>

    <div id="autoplay-video" class="mq-video-shell mq-autoplay-video-shell is-concealed">
      <div id="autoplay-video-player" class="mq-video-player"></div>
      <div id="autoplay-video-overlay" class="mq-video-overlay">
        <div class="mq-video-overlay__content">
          <div class="mq-video-overlay__timer">
            <svg class="mq-timer-ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="mq-timer-ring__track" cx="60" cy="60" r="44"></circle>
              <circle id="autoplay-ring-progress" class="mq-timer-ring__progress" cx="60" cy="60" r="44"></circle>
            </svg>
            <div class="mq-video-overlay__timer-copy">
              <strong id="autoplay-overlay-title">Préparation</strong>
              <p id="autoplay-overlay-copy">Chargement de la prochaine musique.</p>
            </div>
          </div>
          <p id="autoplay-overlay-hint" class="mq-video-overlay__hint">La réponse s'affichera automatiquement.</p>
        </div>
      </div>
    </div>

    <div class="mq-track-caption">
      <p id="autoplay-playback-failure" class="mq-playback-failure" role="status" hidden></p>
      <div id="autoplay-round-category" class="mq-game-category mq-track-category" hidden></div>
      <div id="autoplay-solution" class="mq-game-solution mq-autoplay-solution" hidden>
        <strong id="autoplay-solution-family"></strong>
        <span id="autoplay-solution-track"></span>
      </div>
    </div>

    <div class="mq-autoplay-footer">
      <div class="mq-video-toolbar">
        <label class="mq-volume-control" for="autoplay-volume">
          <span>Volume</span>
          <input id="autoplay-volume" type="range" min="0" max="100" step="1" value="70" />
        </label>
        <span id="autoplay-volume-value" class="mq-chip">70%</span>
      </div>
    </div>
  </section>
</section>
