<section class="mq-page">
  <div class="mq-player-dashboard mq-main-dashboard">
    <section class="mq-card mq-card--accent mq-play-card">
      <div class="mq-card-heading">
        <div class="mq-kicker">Départ rapide</div>
        <h2>Jouer</h2>
        <p id="main-mode-copy" class="mq-card-copy">Crée un salon si tu organises la partie, ou rejoins directement avec un code.</p>
      </div>

      <div class="mq-main-mode-switch" role="group" aria-label="Mode de jeu">
        <button id="btn-main-mode-active" type="button" data-main-mode="participative" class="is-active">
          <span>Actif</span>
          <small>Réponses, scores, classement</small>
        </button>
        <button id="btn-main-mode-passive" type="button" data-main-mode="autoplay">
          <span>Passif</span>
          <small>Écoute automatique, TV possible</small>
        </button>
      </div>

      <div class="mq-main-action-stack">
        <div class="mq-main-action-block mq-main-action-block--primary">
          <div class="mq-main-action-block__head">
            <span class="mq-step-badge">1</span>
            <div>
              <p class="mq-section-label">Organisateur</p>
              <strong id="main-create-title">Créer un salon</strong>
            </div>
          </div>
          <div class="mq-field">
            <label for="main-lobby-name">Nom du salon</label>
            <input id="main-lobby-name" type="text" maxlength="120" placeholder="Blindtest du vendredi" />
          </div>
          <label class="mq-check mq-check--compact">
            <input id="main-lobby-public" type="checkbox" checked />
            <span>Visible dans la liste des salons publics</span>
          </label>
          <button id="btn-main-create" type="button">Créer le salon</button>
        </div>

        <div class="mq-main-action-block">
          <div class="mq-main-action-block__head">
            <span class="mq-step-badge">2</span>
            <div>
              <p class="mq-section-label">Invité</p>
              <strong>Rejoindre par code</strong>
            </div>
          </div>
          <div class="mq-field">
            <label for="main-lobby-code">Code du salon</label>
            <input id="main-lobby-code" type="text" maxlength="16" placeholder="ABC123" />
          </div>
          <button id="btn-main-join-code" type="button">Entrer dans le salon</button>
        </div>
      </div>

      <p id="main-status" class="status"></p>

      <div class="mq-actions mq-actions--compact mq-actions--full">
        <button id="btn-main-suggest-track" type="button" class="mq-secondary mq-button-block">Proposer une musique</button>
      </div>

      <div id="main-admin-actions" class="mq-actions mq-actions--compact mq-actions--full">
        <button id="btn-main-management" type="button" class="mq-secondary mq-button-block">Gestion du catalogue</button>
      </div>
    </section>

    <section class="mq-card mq-card--soft mq-public-lobbies-card">
      <div class="mq-card-heading">
        <div class="mq-kicker">Public</div>
        <h2 id="main-public-title">Rejoindre une partie ouverte</h2>
        <p id="main-public-copy" class="mq-card-copy">Choisis un salon public disponible. Les salons privés se rejoignent avec un code.</p>
      </div>

      <div class="mq-list-toolbar">
        <div>
          <span id="main-lobby-count" class="mq-chip">0 salon actif</span>
        </div>
        <button id="btn-main-refresh" type="button" class="mq-secondary">Rafraîchir</button>
      </div>

      <ul id="main-lobby-list" class="mq-clean-list"></ul>
    </section>
  </div>
</section>
