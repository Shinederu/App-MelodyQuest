<section class="mq-page mq-validation-page">
  <section class="mq-card mq-card--soft">
    <div class="mq-admin-toolbar">
      <div class="mq-actions">
        <button id="btn-validation-refresh" type="button" class="mq-secondary">Rafraîchir</button>
      </div>
      <div class="mq-admin-toolbar__meta">
        <div class="mq-admin-toolbar__cluster">
          <span id="validation-count" class="mq-chip">0 musique en attente</span>
        </div>
        <p id="validation-status" class="status" role="status"></p>
      </div>
    </div>
  </section>

  <div class="mq-admin-workspace">
    <section class="mq-card mq-admin-pane">
      <div class="mq-admin-pane__header">
        <div class="mq-card-heading">
          <h2>Musiques à vérifier</h2>
        </div>
      </div>
      <div class="mq-admin-form-grid">
        <div class="mq-field"><label for="validation-filter-category">Catégorie</label><select id="validation-filter-category"><option value="">Toutes les catégories</option></select></div>
        <div class="mq-field"><label for="validation-search">Rechercher</label><input id="validation-search" type="search" placeholder="Œuvre, musique, artiste…" /></div>
      </div>
      <div class="mq-admin-list-shell">
        <div id="validation-list" class="mq-admin-list"></div>
      </div>
      <nav class="mq-validation-pagination" aria-label="Pages des musiques en attente">
        <button id="btn-validation-prev" type="button" class="mq-secondary mq-icon-button" aria-label="Page précédente" title="Page précédente">←</button>
        <span id="validation-pagination" class="mq-muted" aria-live="polite"></span>
        <button id="btn-validation-next" type="button" class="mq-secondary mq-icon-button" aria-label="Page suivante" title="Page suivante">→</button>
      </nav>
    </section>

    <section class="mq-card mq-card--accent mq-admin-pane mq-admin-pane--sticky">
      <div class="mq-card-heading">
        <h2 id="validation-detail-title">Aucune musique sélectionnée</h2>
        <p id="validation-detail-helper" class="mq-admin-helper"></p>
      </div>

      <div class="mq-admin-form-grid">
        <div id="validation-detail-meta" class="mq-admin-item__meta">
          <span class="mq-muted">Aucune piste n'est sélectionnée pour le moment.</span>
        </div>

        <div class="mq-admin-form-split">
          <div class="mq-field">
            <label for="validation-start-offset">Début (m:ss ou secondes)</label>
            <input id="validation-start-offset" type="text" placeholder="0:00" disabled />
          </div>
          <div class="mq-field">
            <label for="validation-end-offset">Fin (m:ss ou secondes)</label>
            <input id="validation-end-offset" type="text" placeholder="Fin de la vidéo" disabled />
          </div>
        </div>
        <div class="mq-actions">
          <button id="btn-validation-preview" type="button" class="mq-secondary">Écouter l’extrait</button>
          <button id="btn-validation-open-youtube" type="button" class="mq-secondary" disabled>Ouvrir sur YouTube</button>
        </div>
        <div class="mq-validation-video-shell">
          <div id="validation-preview-empty" class="mq-video-placeholder">
            <p class="mq-muted">Aucune preview disponible pour le moment.</p>
          </div>
          <iframe
            id="validation-preview-frame"
            hidden
            src=""
            title="Preview YouTube de validation"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>

        <div id="validation-edit-form" class="mq-admin-form-grid">
          <div class="mq-admin-form-split">
            <div class="mq-field">
              <label for="validation-category">Catégorie</label>
              <select id="validation-category" disabled></select>
            </div>

            <div class="mq-field">
              <label for="validation-family-name">Œuvre / réponse attendue</label>
              <input id="validation-family-name" type="text" list="validation-family-options" placeholder="Ex: Pokémon" disabled />
              <datalist id="validation-family-options"></datalist>
            </div>
          </div>

          <div class="mq-field mq-validation-alias-field">
            <label for="validation-alias-input">Alias acceptés</label>
            <div class="mq-alias-editor">
              <div class="mq-alias-editor__add">
                <input id="validation-alias-input" type="text" placeholder="Ex: Pokémon, Pocket Monsters" disabled />
                <button id="btn-validation-add-alias" type="button" class="mq-secondary mq-inline-btn" disabled>Ajouter</button>
              </div>
              <div id="validation-alias-list" class="mq-alias-list" aria-live="polite"></div>
            </div>
          </div>

          <div class="mq-admin-form-split">
            <div class="mq-field">
              <label for="validation-track-title">Libellé de la piste</label>
              <input id="validation-track-title" type="text" placeholder="Ex: Ending S1" disabled />
            </div>

            <div class="mq-field">
              <label for="validation-track-artist">Artiste / licence</label>
              <input id="validation-track-artist" type="text" placeholder="Ex: Pokémon" disabled />
            </div>
          </div>

          <div class="mq-field">
            <label for="validation-youtube-url">ID ou URL YouTube</label>
            <input id="validation-youtube-url" type="text" placeholder="Ex: dQw4w9WgXcQ ou https://www.youtube.com/watch?v=..." disabled />
          </div>

        <div class="mq-field">
          <label for="validation-familiarity">Note admin (1 : niche, 10 : très connue)</label>
          <input id="validation-familiarity" type="number" min="1" max="10" step="1" placeholder="Non évaluée" />
        </div>
        </div>


        <div class="mq-validation-meta">
          <div class="mq-field">
            <label for="validation-track-url">Lien YouTube</label>
            <a id="validation-track-url" class="mq-link" href="#" target="_blank" rel="noreferrer noopener">Aucun lien</a>
          </div>
          <p id="validation-track-created" class="mq-muted">Date d'ajout indisponible</p>
        </div>
      </div>

      <div class="mq-admin-form-actions">
        <button id="btn-validation-approve" type="button" disabled>Valider et continuer</button>
        <button id="btn-validation-reject" type="button" class="mq-danger" disabled>Refuser et supprimer</button>
      </div>
    </section>
  </div>
</section>
